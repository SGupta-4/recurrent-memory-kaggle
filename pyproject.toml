[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrent_memory"
version = "0.1.0"
description = "Research project: Recurrent Memory for Long-Horizon Trajectories"
dependencies = [
    "torch>=2.0.0",
    "pyyaml",
    "pytest",
    "tqdm"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
